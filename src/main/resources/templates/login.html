<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Spring Security Login Page</title>

     <style>
           body{ 
              font-family: Arial;
              background-color: #e1a1e2;
           }
           
           .login-box{
                width:350px;
                margin:100px auto; 
                padding: 25px; 
                background: white; 
                border-radius:10px; 
                box-shadow:0 0 10px gray;               
           }
           h2{
               text-align: center;
               color: red;
           }
           
           label{
               display: block;
               margin-top: 15px;
               font-weight: bold;            
           }
            
           input{
               width:100%;
               padding:10px;
               box-sizing:border-box;  
               margin-top: 5px;
               border: 1px solid black;
               border-radius: 5px;
           }
           
           button{        
               width:100%; 
               padding:10px;
               margin-top: 20px;
               background-color: #007bff; 
               color:white;
               border:none;
               border-radius: 5px; 
               cursor:pointer;                
           }
           button:hover{
                background-color: #0056b3;
           }
           
           p{        
              text-align: center;
           }
           
     </style>
</head>
<body>
        <div class="login-box">
          <h2>Student Management Login</h2>             
              <div th:if="${param.error}">
                   <p style="color:red">Invalid userName and Password</p>
              </div>
               <div th:if="${param.logout}">
                   <p style="color:green">You have logged out successfully</p>
              </div>
              
              <form th:action="@{/login}" method="post">
              
                      <label>UserName</label>
                      <input type="text" name="username" placeholder="Enter username" required/>
                      
                      <label>Password</label>
                      <input type="password" name="password" placeholder="Enter password" required/>
                      
                      <button type="submit">Login</button>
                      
              </form>
        </div>

</body>
</html>
